<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>IRRELEVANT GIRL: THE PLACEMENT MYSTERY</title>
<style>
:root{
  --bg:#07080d; --panel:#0d111b; --panel2:#111827; --line:#273248;
  --text:#e8edf7; --muted:#7f8aa3; --cyan:#6ee7ff; --pink:#ff6fae;
  --green:#8df5bd; --yellow:#ffd166; --red:#ff6875; --shadow:0 20px 70px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.025) 4px);
  mix-blend-mode:screen;z-index:20
}
button{font:inherit}
#app{min-height:100vh;display:flex;flex-direction:column}
.boot{
  min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(circle at 50% 30%,#182034 0,#090b12 42%,#05060a 100%);
}
.boot-card{width:min(720px,100%);border:1px solid #263248;background:rgba(8,11,18,.88);box-shadow:var(--shadow);padding:28px;border-radius:18px;position:relative;overflow:hidden}
.boot-card:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(110,231,255,.04),transparent 70%);animation:sweep 4s linear infinite}
@keyframes sweep{to{transform:translateX(120%)}}
.kicker{color:var(--cyan);letter-spacing:.18em;text-transform:uppercase;font-size:11px;font-weight:800}
h1{font-size:clamp(30px,7vw,66px);line-height:.93;margin:14px 0 20px;letter-spacing:-.045em}
.glitch{position:relative;display:inline-block}
.glitch:before,.glitch:after{content:attr(data-text);position:absolute;left:0;top:0;opacity:.35;pointer-events:none}
.glitch:before{color:var(--cyan);transform:translate(2px,-1px);clip-path:inset(10% 0 70% 0);animation:glitch 2.5s infinite}
.glitch:after{color:var(--pink);transform:translate(-2px,1px);clip-path:inset(65% 0 12% 0);animation:glitch 1.9s infinite}
@keyframes glitch{0%,90%,100%{opacity:0}92%{opacity:.5;transform:translate(4px,-1px)}94%{opacity:.3;transform:translate(-3px,1px)}}
.boot-log{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#b8c2d8;line-height:1.8;font-size:13px;margin:24px 0}
.boot-log .bad{color:var(--red)} .boot-log .good{color:var(--green)}
.btn{
  appearance:none;border:1px solid #34445f;background:#111827;color:var(--text);
  border-radius:10px;padding:13px 16px;cursor:pointer;transition:.18s;position:relative;z-index:2
}
.btn:hover{transform:translateY(-1px);border-color:var(--cyan);box-shadow:0 0 22px rgba(110,231,255,.12)}
.btn.primary{background:linear-gradient(135deg,#17283a,#10202b);border-color:#3b8ca0;color:#dffaff}
.btn.danger{border-color:#6d3440;color:#ffd9de}
.btn.small{padding:8px 11px;font-size:12px}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
#game{display:none;min-height:100vh}
.hud{
  position:sticky;top:0;z-index:10;background:rgba(7,8,13,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:14px;align-items:center
}
.brand{font-size:11px;font-weight:900;letter-spacing:.12em;white-space:nowrap}
.level-label{color:var(--cyan);font-size:11px}
.progress{height:5px;background:#182031;border-radius:99px;flex:1;overflow:hidden;max-width:260px}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width .5s}
.hud-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line);padding:7px 9px;border-radius:99px;font-size:11px;color:var(--muted)}
.screen{width:min(1080px,100%);margin:auto;padding:28px 18px 60px}
.screen-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}
.eyebrow{font-family:ui-monospace,monospace;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em}
.title{font-size:clamp(28px,6vw,52px);line-height:1;margin:6px 0 10px;letter-spacing:-.04em}
.subtitle{color:#9aa5ba;max-width:680px;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.hud{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}}
.card{
  background:linear-gradient(145deg,rgba(17,24,39,.96),rgba(10,14,23,.96));
  border:1px solid var(--line);border-radius:15px;padding:17px;min-height:150px;box-shadow:0 12px 40px rgba(0,0,0,.2)
}
.object{cursor:pointer;transition:.2s}
.object:hover{border-color:#52647f;transform:translateY(-2px)}
.object h3{margin:0 0 7px;font-size:16px}.object p{margin:0;color:#8f9bb2;font-size:12px;line-height:1.5}
.icon{font-size:28px;margin-bottom:12px}
.tag{display:inline-block;margin-top:12px;padding:4px 7px;border:1px solid #33415a;border-radius:6px;font-size:10px;color:var(--cyan);text-transform:uppercase;letter-spacing:.08em}
.console{background:#05070b;border:1px solid #202a3c;border-radius:12px;padding:16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#b9c5d9;line-height:1.7;min-height:180px;white-space:pre-wrap}
.console .cyan{color:var(--cyan)} .console .pink{color:var(--pink)} .console .green{color:var(--green)} .console .yellow{color:var(--yellow)} .console .red{color:var(--red)}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:30;display:grid;place-items:center;padding:18px}
.modal{width:min(650px,100%);max-height:88vh;overflow:auto;background:#0b1019;border:1px solid #34445f;border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.modal h2{margin:0 0 10px}.modal p{color:#a4aec0;line-height:1.6}.close{float:right}
.inventory{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}
.inv{font-size:11px;padding:7px 9px;border:1px solid #34445f;border-radius:8px;background:#0c1420}
.achievement{position:fixed;right:14px;top:72px;z-index:40;width:min(330px,calc(100% - 28px));padding:14px;background:#101927;border:1px solid #59677d;border-radius:12px;box-shadow:var(--shadow);animation:pop .35s ease}
@keyframes pop{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.achievement b{color:var(--yellow)} .achievement small{display:block;color:#8e9ab0;margin-top:4px}
.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
@media(max-width:760px){.choice-grid{grid-template-columns:1fr}}
.choice{min-height:100px;text-align:left}
.choice strong{display:block;font-size:14px;margin-bottom:7px}.choice span{font-size:11px;color:#8995aa}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.stat{border:1px solid #263248;border-radius:9px;padding:10px}.stat label{display:block;color:#6f7b92;font-size:10px;text-transform:uppercase}.stat b{font-size:14px}
.doors{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
@media(max-width:760px){.doors{grid-template-columns:repeat(2,1fr)}}
.door{min-height:180px;border:1px solid #263248;border-radius:12px;background:linear-gradient(180deg,#131a28,#080b12);display:flex;flex-direction:column;justify-content:flex-end;padding:14px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.door:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent,rgba(110,231,255,.08),transparent);transform:translateX(-100%);transition:.5s}
.door:hover{transform:translateY(-3px);border-color:#5d6e8b}.door:hover:before{transform:translateX(100%)}
.door .door-num{font-size:10px;color:#5f6b80;position:absolute;top:12px;left:12px}.door b{font-size:15px;position:relative}.door small{color:#77839a;margin-top:4px;position:relative}
.final{text-align:center;padding:50px 0}
.final h2{font-size:clamp(38px,9vw,80px);margin:0 0 10px}.heart{color:var(--pink)}
.hidden{display:none!important}
.scanline{animation:scan 1.1s steps(2,end) infinite}
@keyframes scan{50%{opacity:.55}100%{opacity:1}}
</style>
</head>
<body>
<div id="app">
  <section class="boot" id="boot">
    <div class="boot-card">
      <div class="kicker">PLACEMENT CELL // SECURE TERMINAL</div>
      <h1 class="glitch" data-text="IRRELEVANT GIRL">IRRELEVANT GIRL</h1>
      <div class="eyebrow">THE PLACEMENT MYSTERY</div>
      <div class="boot-log" id="bootLog"></div>
      <button class="btn primary" id="beginBtn" onclick="startGame()">BEGIN INVESTIGATION →</button>
    </div>
  </section>

  <main id="game">
    <header class="hud">
      <div class="brand">IG // PM</div>
      <div class="level-label" id="levelLabel">LEVEL 1</div>
      <div class="progress"><span id="progressBar"></span></div>
      <div class="hud-right">
        <div class="pill" id="clueCount">CLUES 0/0</div>
        <button class="btn small" onclick="showInventory()">INVENTORY</button>
      </div>
    </header>
    <div id="screen"></div>
  </main>
</div>

<script>
const state={
  level:0, clues:new Set(), achievements:new Set(), inventory:[],
  investigations:new Set(), choice:null, finalDoors:0, called:false
};
const levels=["THE CRIME SCENE","THE EVIDENCE ROOM","THE PLACEMENT ALGORITHM","HITU HACKS THE SYSTEM","THE IRRELEVANT GIRL'S LAIR","THE OTHER DOORS","CASE CLOSED"];
let bootLines=[
  ["PLACEMENT CELL: IMPORTANT UPDATE",""],
  ["Candidate Status: NOT SELECTED","bad"],
  ["",""],
  ["IRRELEVANT GIRL HAS RECEIVED A PLACEMENT CALL.","bad"],
  ["",""],
  ["SYSTEM ERROR:","red"],
  ["This outcome cannot be mathematically explained.","yellow"],
  ["",""],
  ["OBJECTIVE: FIND OUT WHAT THE FUCK HAPPENED.","cyan"]
];
let clueTargets=0;

function boot(){
  const el=document.getElementById("bootLog");
  let i=0;
  const tick=()=>{
    if(i<bootLines.length){
      const [txt,cls]=bootLines[i++];
      const d=document.createElement("div"); d.className=cls; d.textContent=txt; el.appendChild(d);
      setTimeout(tick, i===2?550:240);
    }
  };
  tick();
}
boot();

function startGame(){
  document.getElementById("boot").style.display="none";
  document.getElementById("game").style.display="block";
  state.level=1; renderLevel1();
}

function updateHUD(){
  document.getElementById("levelLabel").textContent=`LEVEL ${state.level}`;
  document.getElementById("progressBar").style.width=`${Math.min(100,(state.level-1)/6*100)}%`;
  document.getElementById("clueCount").textContent=`CLUES ${state.clues.size}/${clueTargets}`;
}

function setScreen(html){document.getElementById("screen").innerHTML=html;updateHUD();}

function modal(title,body,buttons=""){
  const back=document.createElement("div"); back.className="modal-back"; back.id="modal";
  back.innerHTML=`<div class="modal"><button class="btn small close" onclick="closeModal()">CLOSE</button><h2>${title}</h2><div>${body}</div><div class="actions">${buttons}</div></div>`;
  document.body.appendChild(back);
}
function closeModal(){document.getElementById("modal")?.remove()}

function clue(id,title,text){
  if(!state.clues.has(id)){state.clues.add(id); toast("CLUE UNLOCKED",title,text);updateHUD()}
}
function achievement(id,title,text){
  if(state.achievements.has(id))return;
  state.achievements.add(id);
  const d=document.createElement("div");d.className="achievement";
  d.innerHTML=`<b>ACHIEVEMENT UNLOCKED</b><div>${title}</div><small>${text}</small>`;
  document.body.appendChild(d);setTimeout(()=>d.remove(),3600);
}
function toast(head,title,text){
  const d=document.createElement("div");d.className="achievement";
  d.innerHTML=`<b>${head}</b><div>${title}</div><small>${text}</small>`;
  document.body.appendChild(d);setTimeout(()=>d.remove(),3000);
}
function addItem(item){
  if(!state.inventory.includes(item)){state.inventory.push(item);toast("ITEM ACQUIRED",item,"Added to inventory.");}
}
function showInventory(){
  const items=state.inventory.length?state.inventory.map(x=>`<span class="inv">${x}</span>`).join(""):"<span class='muted'>Empty. Like Irrelevant Girl's work folder.</span>";
  modal("INVENTORY",`<div class="inventory">${items}</div><p><b>Case status:</b> ${state.clues.size} clues collected. ${state.achievements.size} achievements unlocked.</p>`);
}

function renderLevel1(){
  state.level=1;clueTargets=5;
  setScreen(`
    <section class="screen">
      <div class="screen-head"><div><div class="eyebrow">LEVEL 1 // CRIME SCENE</div><div class="title">THE DAY THE MATH BROKE</div>
      <div class="subtitle">Placement day. One student worked like his life depended on it. Another student appears to have contributed approximately one PowerPoint title slide. Yet somehow...</div></div>
      <div class="pill">INVESTIGATE 5 OBJECTS</div></div>
      <div class="card" style="margin-bottom:14px"><div class="console"><span class="red">PLACEMENT CELL:</span> IMPORTANT UPDATE
<span class="yellow">Candidate Status:</span> NOT SELECTED

<span class="pink">IRRELEVANT GIRL HAS RECEIVED A PLACEMENT CALL.</span>

<span class="red">SYSTEM ERROR:</span> This outcome cannot be mathematically explained.
<span class="cyan scanline">OBJECTIVE: FIND OUT WHAT THE FUCK HAPPENED.</span></div></div>
      <div class="grid">
        ${obj("resume","📄","HIS RESUME","A suspiciously competent document.","Inspect")}
        ${obj("work","🗂️","HIS WORK FOLDER","Heavy. Probably contains actual work.","Inspect")}
        ${obj("notes","📝","PREPARATION NOTES","Evidence of preparation. Lots of it.","Inspect")}
        ${obj("phone","📱","PLACEMENT PHONE","Currently providing emotional damage.","Inspect")}
        ${obj("girl","👤","IRRELEVANT GIRL","She is standing there. Somehow.","Investigate")}
        ${obj("board","▣","PLACEMENT NOTICEBOARD","Names. Outcomes. Chaos.","Inspect")}
      </div>
    </section>`);
}
function obj(id,icon,title,desc,action){return `<div class="card object" onclick="inspect('${id}')"><div class="icon">${icon}</div><h3>${title}</h3><p>${desc}</p><span class="tag">${action}</span></div>`}

function inspect(id){
  if(state.investigations.has(id))return modal("ALREADY INVESTIGATED","You've already stared at this evidence long enough. Move on, detective.");
  state.investigations.add(id);
  const data={
    resume:["HIS RESUME",`Pages of internships, projects, skills and suspicious amounts of effort.<br><br><span class="cyan">SYSTEM:</span> Resume quality: annoyingly solid.<br><span class="yellow">Verdict:</span> No obvious explanation here.`,"resume"],
    work:["HIS WORK FOLDER",`You open it. Then open another folder. Then another.<br><br><span class="green">SYSTEM:</span> Bro worked.<br><span class="green">SYSTEM:</span> Bro REALLY worked.<br><br>The folder weighs approximately 4.7 emotional kilograms.`,"work"],
    notes:["PLACEMENT PREPARATION NOTES",`Mock interviews. Company research. Questions. Answers. Notes on notes.<br><br><span class="cyan">SYSTEM:</span> Preparation detected.<br><span class="yellow">SYSTEM:</span> Excessive preparation detected.`,"notes"],
    phone:["PLACEMENT PHONE",`Notifications: 17.<br>Missed call: 0.<br>Placement call: 0.<br><br>The phone is silent in the specific way only a placement phone can be.`,"phone"],
    girl:["IRRELEVANT GIRL",`<div class="stat-grid"><div class="stat"><label>Work Completed</label><b>0.7%</b></div><div class="stat"><label>Effort</label><b>CLASSIFIED</b></div><div class="stat"><label>Contribution</label><b>QUESTIONABLE</b></div><div class="stat"><label>Luck</label><b>1000%</b></div><div class="stat"><label>Placement Call</label><b>RECEIVED</b></div><div class="stat"><label>Explanation</label><b>UNKNOWN</b></div></div><br><span class="pink">IRRELEVANT GIRL:</span> “I got the call!”<br><span class="cyan">SYSTEM:</span> “Yes. We know.”<br><br><span class="pink">IRRELEVANT GIRL:</span> “Honestly? I don’t know.”`,"girl"],
    board:["PLACEMENT NOTICEBOARD",`Rows of names. Green ticks. Red crosses. No footnotes.<br><br><span class="red">SYSTEM:</span> Decision transparency: 0%.<br><span class="yellow">System recommendation:</span> Investigate further.`,"board"]
  };
  const [title,body,key]=data[id];
  if(id==="girl"){clue("useless","USELESS BUT IMPORTANT CLUE","Irrelevant Girl has somehow received the call. She has no explanation.");}
  if(id==="work")clue("effort","EVIDENCE OF EFFORT","The evidence confirms the protagonist actually worked.");
  if(id==="notes")clue("prep","PREPARATION EVIDENCE","Preparation was real. Outcome was not proportional.");
  if(id==="board")clue("chaos","THE NOTICEBOARD","The system gives outcomes without giving satisfying reasons.");
  if(id==="phone")clue("silence","THE SILENT PHONE","No placement call arrived. The silence is the clue.");
  if(id==="resume")clue("resume","THE RESUME","No obvious competence-related explanation found.");
  modal(title,body);
  if(state.investigations.size>=6){
    setTimeout(()=>{closeModal();achievement("crime","CASE FILE OPENED","You've found enough evidence to enter the Evidence Room.");setTimeout(renderLevel2,900)},500);
  }
}

function renderLevel2(){
  state.level=2;clueTargets=8;state.investigations=new Set();
  setScreen(`<section class="screen"><div class="screen-head"><div><div class="eyebrow">LEVEL 2 // EVIDENCE ROOM</div><div class="title">FOLLOW THE PAPER TRAIL</div><div class="subtitle">Three folders. One reality. Several questionable file names.</div></div></div>
  <div class="grid">
    ${obj("f1","📁","FILE 01: HIS WORK","Contains projects, preparation, applications, interviews and evidence of effort.","OPEN")}
    ${obj("f2","📁","FILE 02: IRRELEVANT GIRL'S WORK","A folder with one suspiciously familiar PowerPoint.","OPEN")}
    ${obj("f3","📁","FILE 03: THE PLACEMENT CALL","The call exists. Unfortunately.","OPEN")}
  </div></section>`);
}
function evidence(id){
  const body={
    f1:`A huge archive.<br><br><span class="green">SYSTEM:</span> Bro worked.<br><span class="green">SYSTEM:</span> Bro prepared.<br><span class="green">SYSTEM:</span> Bro showed up.<br><br><span class="yellow">Conclusion:</span> effort was not the missing ingredient.`,
    f2:`Filename found:<br><br><span class="pink">final_final_REAL_final.pptx</span><br><br>Opening...<br><br><span class="pink">IRRELEVANT GIRL:</span> “Guys what are we doing?”<br><br><span class="cyan">SYSTEM:</span> Contribution detected.<br><span class="yellow">SYSTEM:</span> Contribution level: unclear.`,
    f3:`Timestamp: TODAY.<br>Recipient: IRRELEVANT GIRL.<br>Status: RECEIVED.<br><br><span class="red">SYSTEM:</span> We have discovered something disturbing.<br><br><span class="pink">LUCK IS REAL.</span>`
  }[id];
  clue(id,`FILE ${id.slice(1)} UNLOCKED`,body.replace(/<[^>]*>/g," "));
  modal(id==="f1"?"FILE 01":id==="f2"?"FILE 02":"FILE 03",body);
  state.investigations.add(id);
  if(state.investigations.size===3){
    setTimeout(()=>{closeModal();achievement("luck","THE LUCK VARIABLE","The system has acknowledged that luck exists. Nobody is happy about it.");setTimeout(renderLevel3,900)},500)
  }
}
function renderLevel3(){
  state.level=3;clueTargets=10;
  setScreen(`<section class="screen"><div class="screen-head"><div><div class="eyebrow">LEVEL 3 // CORE SYSTEM</div><div class="title">THE PLACEMENT ALGORITHM</div><div class="subtitle">You enter a room containing the machine responsible for translating thousands of human hours into one tiny green tick.</div></div></div>
  <div class="card"><div class="console" id="algoConsole"><span class="cyan">PLACEMENT ALGORITHM v7.3</span>
<span class="scanline">INITIALISING DECISION ENGINE...</span>

QUESTION:
WHO DESERVES THE PLACEMENT?</div>
  <div class="choice-grid">
    <button class="btn choice" onclick="algo('A')"><strong>A. THE PERSON WHO WORKED HARDEST</strong><span>Effort. Preparation. Evidence.</span></button>
    <button class="btn choice" onclick="algo('B')"><strong>B. THE PERSON WHO PERFORMED BEST</strong><span>Interview performance. Fit. Metrics.</span></button>
    <button class="btn choice" onclick="algo('C')"><strong>C. IRRELEVANT GIRL</strong><span>There is no defensible reason.</span></button>
  </div></div></section>`);
}
function algo(choice){
  const c=document.getElementById("algoConsole");
  if(choice!=="C"){
    c.innerHTML+=`\\n\\n<span class="yellow">ALGORITHM:</span> Reasonable answer.\\n<span class="red">SYSTEM:</span> Unfortunately, I do not operate on reason.`;
    toast("ALGORITHM ERROR","That would make too much sense.","Try the option the universe apparently selected.");
    return;
  }
  c.innerHTML+=`\\n\\n<span class="green">ALGORITHM:</span> CORRECT.\\n<span class="red">ALGORITHM:</span> Unfortunately.\\n\\nEffort, ability, timing, luck and outcome do not always exist in the same universe.\\n\\n<span class="pink">*** SYSTEM INSTABILITY DETECTED ***</span>`;
  clue("algorithm","THE ALGORITHM'S CONFESSION","The outcome was never a perfect equation of effort and reward.");
  achievement("algorithm","YOU FOUND THE BUG","The algorithm admits that reality is badly designed.");
  setTimeout(renderLevel4,1700);
}

function renderLevel4(){
  state.level=4;clueTargets=11;
  setScreen(`<section class="screen"><div class="screen-head"><div><div class="eyebrow">LEVEL 4 // UNAUTHORIZED ACCESS</div><div class="title">HITU HACKS THE SYSTEM</div><div class="subtitle">The room goes black. For three seconds, nothing happens. Then someone overrides the entire placement system.</div></div></div>
  <div class="card"><div class="console" id="hackConsole"><span class="red">SCREEN BLACK.</span>

UNKNOWN USER HAS ENTERED THE SYSTEM.

AUTHENTICATING...
<span class="pink">HITU</span>

<span class="green">ACCESS GRANTED.</span>

Hitu: “Okay. I’ve seen enough.”</div>
  <div class="actions"><button class="btn primary" onclick="revealHitu()">LET HITU IN →</button></div></div></section>`);
}
function revealHitu(){
  const c=document.getElementById("hackConsole");
  c.innerHTML+=`\\n\\n<span class="pink">HITU:</span> “We’re not letting one stupid placement decision convince you that you aren’t good enough.”\\n\\n<span class="pink">HITU:</span> “But I would also like to speak to whoever made this decision.”\\n\\n<span class="yellow">SYSTEM:</span> Hitu has joined the party.`;
  addItem("HITU’S SUPPORT");addItem("COMMON SENSE");addItem("ONE EXTREMELY PETTY THOUGHT");
  clue("hitu","HITU HAS ENTERED THE SYSTEM","Someone is now actively on your side.");
  achievement("sidekick","SECRET SIDEKICK","Hitu has breached the placement network.");
  setTimeout(renderLevel5,1900);
}

function renderLevel5(){
  state.level=5;clueTargets=12;
  setScreen(`<section class="screen"><div class="screen-head"><div><div class="eyebrow">LEVEL 5 // NPC LOCATION UNKNOWN</div><div class="title">THE IRRELEVANT GIRL'S LAIR</div><div class="subtitle">Coordinates acquired. You find her exactly where the evidence suggested she would be: doing absolutely nothing.</div></div></div>
  <div class="card">
    <div class="stat-grid"><div class="stat"><label>Effort</label><b>0</b></div><div class="stat"><label>Luck</label><b>∞</b></div><div class="stat"><label>Placement</label><b>YES</b></div><div class="stat"><label>Logic</label><b>NONE</b></div></div>
    <div class="console" style="margin-top:15px"><span class="pink">IRRELEVANT GIRL:</span> “Oh. Hi.”\\n\\nShe appears to be waiting for absolutely nothing.\\n\\n<span class="cyan">HITU:</span> “Ask her.”</div>
    <div class="choice-grid">
      <button class="btn choice" onclick="girlChoice('confront')"><strong>CONFRONT HER</strong><span>Demand an explanation.</span></button>
      <button class="btn choice" onclick="girlChoice('accept')"><strong>ACCEPT THE CHAOS</strong><span>Maybe the universe is just badly coded.</span></button>
      <button class="btn choice" onclick="girlChoice('investigate')"><strong>INVESTIGATE FURTHER</strong><span>There has to be something.</span></button>
    </div>
  </div></section>`);
}
function girlChoice(x){
  if(x==="confront"){
    clue("girltruth","THE TRUTH","Irrelevant Girl admits she got lucky.");
    modal("INTERROGATION COMPLETE",`<span class="pink">IRRELEVANT GIRL:</span> “I just got lucky.”<br><br><span class="cyan">SYSTEM:</span> CRITICAL HIT.<br><br>There is no secret mastermind. No evil plan. No satisfying spreadsheet.<br><br>Just luck being incredibly annoying.`);
  } else if(x==="accept"){
    achievement("chaos","CHARACTER DEVELOPMENT","You accepted that some outcomes are simply ridiculous.");
    modal("CHAOS ACCEPTED",`<span class="green">SYSTEM:</span> Achievement unlocked: CHARACTER DEVELOPMENT.<br><br>You have stopped trying to force a clean explanation onto an inherently messy outcome.`);
  } else {
    achievement("irrelevant","THE IRRELEVANT GIRL WAS, IN FACT, IRRELEVANT","You investigated further and found absolutely nothing.");
    modal("FURTHER INVESTIGATION",`You search the room.<br>You search her laptop.<br>You search the suspiciously empty folder.<br><br>Nothing.<br><br><span class="cyan">SYSTEM:</span> She really is irrelevant.`);
  }
  setTimeout(()=>{closeModal();renderLevel6()},1100);
}

function renderLevel6(){
  state.level=6;clueTargets=12;
  setScreen(`<section class="screen"><div class="screen-head"><div><div class="eyebrow">FINAL LEVEL // UNLOCKED</div><div class="title">THE OTHER DOORS</div><div class="subtitle">The mystery is over. The building changes. You enter a room containing hundreds of possible futures.</div></div></div>
  <div class="card"><div class="console"><span class="cyan">FUTURE NAVIGATION SYSTEM</span>\\n\\nEvery door is an outcome you haven't lived yet.\\n\\n<span class="pink">HITU:</span> “Pick one. Or don't.”</div></div>
  <div class="doors">
    ${door("01","COMPANY A","A possibility.")}
    ${door("02","COMPANY B","Another possibility.")}
    ${door("03","STARTUP","Slightly chaotic.")}
    ${door("04","SOMETHING YOU HAVEN'T THOUGHT OF YET","Unknown.")}
    ${door("05","SOMETHING COMPLETELY RANDOM","Very on brand.")}
    ${door("06","SOMETHING BETTER","No guarantees. Still possible.")}
    ${door("07","A CAREER YOU NEVER EXPECTED","Plot twist territory.")}
    ${door("08","L'ORÉAL","The door you were hoping would open today.")}
  </div></section>`);
}
function door(n,title,desc){
  const safe=title.replace(/'/g,"&#39;");
  return `<div class="door" onclick="openDoor('${safe}')"><span class="door-num">DOOR ${n}</span><b>${title}</b><small>${desc}</small></div>`;
}
function openDoor(title){
  if(title==="L&#39;ORÉAL" || title==="L'ORÉAL"){
    modal("DOOR LOCKED",`The handle doesn't move.<br><br><span class="yellow">SYSTEM:</span> This was one opportunity.<br><br><span class="cyan">SYSTEM:</span> It was never the only opportunity.<br><br><span class="pink">HITU:</span> “You don't have to know which door you're taking yet.”<br><br><span class="pink">HITU:</span> “You just have to stop thinking this was the last one.”`);
  } else {
    state.finalDoors++;
    modal(title,`The door opens a little.<br><br>Nothing is revealed yet. Which is kind of the point.<br><br><span class="cyan">SYSTEM:</span> Future not generated. Keep moving.`);
    if(state.finalDoors>=3)achievement("doors","DOOR EXPLORER","You checked three possible futures instead of staring at one locked door.");
  }
  if(state.finalDoors>=3 && !state.called){
    setTimeout(()=>{closeModal();setTimeout(renderFinal,900)},1000);
  }
}
function renderFinal(){
  state.level=7;
  setScreen(`<section class="screen final"><div class="eyebrow">CASE FILE // COMPLETE</div><h2>YOU SURVIVED.</h2>
  <div class="card" style="max-width:650px;margin:22px auto;text-align:left">
    <div class="console"><span class="green">Placement:</span> Pending
<span class="green">Career:</span> Very much alive
<span class="yellow">Sanity:</span> Questionable
<span class="pink">Irrelevant Girl:</span> Unfortunately still placed
<span class="pink">Hitu:</span> Still here ❤️</div>
  </div>
  <div class="card" style="max-width:650px;margin:auto">
    <div class="eyebrow">NEW QUEST UNLOCKED</div><h3 style="font-size:25px;margin:10px 0">GET OUT OF YOUR HEAD.</h3>
    <p style="color:#98a4b8">Reward:</p><p style="font-size:20px"><b>ONE HITU</b></p>
    <p style="color:#98a4b8">Redeemable immediately.<br>No placement required.<br>No interview necessary.<br>Permanent position available.</p>
    <button class="btn primary" onclick="callHitu()">CALL HITU ❤️</button>
  </div></section>`);
}
function callHitu(){
  state.called=true;
  modal("INCOMING TRANSMISSION // HITU",`<div class="console"><span class="pink">HITU:</span> “Hi, stupid.”<br><br>“I know today sucked.”<br><br>“And I know it feels especially ridiculous because you actually worked for this.”<br><br>“But I made you this because I refuse to let one stupid call become the entire story.”<br><br>“So yeah. Be annoyed. Be petty. Complain about the algorithm with me.”<br><br><span class="pink">“Then we'll figure out what's next.”</span><br><br>“Also, for the record, I'm still very impressed by you.” ❤️</div>`,`<button class="btn primary" onclick="closeModal()">STAY ON THE CALL ❤️</button>`);
  achievement("hitu","PERMANENT POSITION FILLED","Hitu is officially on your team.");
}
</script>
</body>
</html>
